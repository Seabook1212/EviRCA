pod_discovery: 'kube_pod_info{namespace="{namespace}"}'

kpi_candidates:
  request_rate:
    - 'sum by (pod) (rate(istio_requests_total{reporter="destination",destination_workload_namespace="{namespace}",destination_pod="{pod}"}[{istio_window}]))'
    - 'sum by (pod) (rate(istio_requests_total{reporter="destination",destination_workload_namespace="{namespace}",pod="{pod}"}[{istio_window}]))'
    - 'sum(rate(istio_requests_total{reporter="destination",destination_workload_namespace="{namespace}",destination_workload="{service}"}[{istio_window}]))'
  success_rate:
    - '(sum(rate(istio_requests_total{reporter="destination",destination_workload_namespace="{namespace}",destination_pod="{pod}",response_code=~"200|201|202|204|300|301|302|304"}[{istio_window}])) / sum(rate(istio_requests_total{reporter="destination",destination_workload_namespace="{namespace}",destination_pod="{pod}"}[{istio_window}]))) * 100'
    - '(sum(rate(istio_requests_total{reporter="destination",destination_workload_namespace="{namespace}",pod="{pod}",response_code=~"200|201|202|204|300|301|302|304"}[{istio_window}])) / sum(rate(istio_requests_total{reporter="destination",destination_workload_namespace="{namespace}",pod="{pod}"}[{istio_window}]))) * 100'
    - '(sum(rate(istio_requests_total{reporter="destination",destination_workload_namespace="{namespace}",destination_workload="{service}",response_code=~"200|201|202|204|300|301|302|304"}[{istio_window}])) / sum(rate(istio_requests_total{reporter="destination",destination_workload_namespace="{namespace}",destination_workload="{service}"}[{istio_window}]))) * 100'
  error_count:
    - '(sum(increase(istio_requests_total{reporter="destination",destination_workload_namespace="{namespace}",destination_pod="{pod}",response_code=~"5.."}[{kpi_window}])))'
    - '(sum(increase(istio_requests_total{reporter="destination",destination_workload_namespace="{namespace}",pod="{pod}",response_code=~"5.."}[{kpi_window}])))'
    - '(sum(increase(istio_requests_total{reporter="destination",destination_workload_namespace="{namespace}",destination_workload="{service}",response_code=~"5.."}[{kpi_window}])))'
  latency_p50:
    - 'histogram_quantile(0.50, sum by (destination_pod, le) (rate(istio_request_duration_milliseconds_bucket{reporter="destination",destination_workload_namespace="{namespace}",destination_pod="{pod}"}[{istio_window}])))'
    - 'histogram_quantile(0.50, sum by (pod, le) (rate(istio_request_duration_milliseconds_bucket{reporter="destination",destination_workload_namespace="{namespace}",pod="{pod}"}[{istio_window}])))'
    - 'histogram_quantile(0.50, sum by (destination_workload, le) (rate(istio_request_duration_milliseconds_bucket{reporter="destination",destination_workload_namespace="{namespace}",destination_workload="{service}"}[{istio_window}])))'
  latency_p90:
    - 'histogram_quantile(0.90, sum by (destination_pod, le) (rate(istio_request_duration_milliseconds_bucket{reporter="destination",destination_workload_namespace="{namespace}",destination_pod="{pod}"}[{istio_window}])))'
    - 'histogram_quantile(0.90, sum by (pod, le) (rate(istio_request_duration_milliseconds_bucket{reporter="destination",destination_workload_namespace="{namespace}",pod="{pod}"}[{istio_window}])))'
    - 'histogram_quantile(0.90, sum by (destination_workload, le) (rate(istio_request_duration_milliseconds_bucket{reporter="destination",destination_workload_namespace="{namespace}",destination_workload="{service}"}[{istio_window}])))'
  latency_p95:
    - 'histogram_quantile(0.95, sum by (destination_pod, le) (rate(istio_request_duration_milliseconds_bucket{reporter="destination",destination_workload_namespace="{namespace}",destination_pod="{pod}"}[{istio_window}])))'
    - 'histogram_quantile(0.95, sum by (pod, le) (rate(istio_request_duration_milliseconds_bucket{reporter="destination",destination_workload_namespace="{namespace}",pod="{pod}"}[{istio_window}])))'
    - 'histogram_quantile(0.95, sum by (destination_workload, le) (rate(istio_request_duration_milliseconds_bucket{reporter="destination",destination_workload_namespace="{namespace}",destination_workload="{service}"}[{istio_window}])))'
  latency_p99:
    - 'histogram_quantile(0.99, sum by (destination_pod, le) (rate(istio_request_duration_milliseconds_bucket{reporter="destination",destination_workload_namespace="{namespace}",destination_pod="{pod}"}[{istio_window}])))'
    - 'histogram_quantile(0.99, sum by (pod, le) (rate(istio_request_duration_milliseconds_bucket{reporter="destination",destination_workload_namespace="{namespace}",pod="{pod}"}[{istio_window}])))'
    - 'histogram_quantile(0.99, sum by (destination_workload, le) (rate(istio_request_duration_milliseconds_bucket{reporter="destination",destination_workload_namespace="{namespace}",destination_workload="{service}"}[{istio_window}])))'
  cpu_usage_pct:
    - '(sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="{namespace}",pod="{pod}",container!="POD",container!="istio-proxy"}[{kpi_window}])) / clamp_min(sum by (pod) (kube_pod_container_resource_limits{namespace="{namespace}",pod="{pod}",resource="cpu",container!="POD",container!="istio-proxy"}), 0.001)) * 100'
  memory_usage_pct:
    - '(sum by (pod) (container_memory_working_set_bytes{namespace="{namespace}",pod="{pod}",container!="POD",container!="istio-proxy"}) / clamp_min(sum by (pod) (kube_pod_container_resource_limits{namespace="{namespace}",pod="{pod}",resource="memory",container!="POD",container!="istio-proxy"}), 1)) * 100'
  restart_count:
    - 'sum(increase(kube_pod_container_status_restarts_total{namespace="{namespace}",pod="{pod}"}[{restart_count_window}]))'
  ready_ratio:
    - 'avg_over_time(kube_pod_status_ready{namespace="{namespace}",pod="{pod}",condition="true"}[{kpi_window}])'
  network_rx:
    - 'sum by (pod) (rate(container_network_receive_bytes_total{namespace="{namespace}",pod="{pod}"}[{network_window}]))'
  network_tx:
    - 'sum by (pod) (rate(container_network_transmit_bytes_total{namespace="{namespace}",pod="{pod}"}[{network_window}]))'
